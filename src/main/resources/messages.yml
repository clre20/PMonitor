status-storage: " &7容量：&f{used} &7（提醒 {warn}／上限 {stop}）"
status-blocked: " &c容量已滿，錄製已停止。"

# ===== 錄製檔 =====
status:
  recording: "&c錄製中"
  completed: "&a完成"
  interrupted: "&6中斷"
replay-name: "{player} {time}"
replay-name-part: "{player} {time}（第{part}段）"
list-header: "&b===== 錄製檔（{count}）====="
list-header-player: "&b===== {player} 的錄製檔（{count}）====="
list-line: " &f{file} &7{duration} &8{size} {status}"
list-empty: " &7沒有錄製檔。"
list-more: " &7…還有 {count} 個，請用介面查看。"
file-not-found: "&c找不到 {file}。"
delete-confirm: "&e30 秒內再輸入 /{label} delete {file} 確認刪除。"
deleted: "&a已刪除 {file}。"
delete-failed: "&c刪除 {file} 失敗：{error}"
delete-recording: "&c錄製中的檔案不能刪除。"

# ===== 下載 =====
download-disabled: "&c下載已關閉（config 的 download.enabled）。"
download-no-hub: "&c下載需要安裝 HttpHub。"
download-not-running: "&cHttpHub 端口沒有啟動，請看主控台。"
download-no-address: "&c取不到伺服器網址，請設定 HttpHub 的 public-url。"
download-path: "&7檔案位置：&f{path}"
download-recording: "&c錄製中的檔案不能下載。"
download-link: "&a{file}（{minutes} 分鐘內有效）："
download-click: "&b&n點此下載"

# ===== 下載網頁（純文字）=====
web:
  not-found: "找不到檔案"
  expired: "連結無效或已過期"
  too-large: "檔案太大，請到伺服器後台取檔"
  busy: "伺服器忙碌中，請稍後再試"

# ===== 容量 =====
storage-warn: "&e錄製檔 {used}，超過提醒值 {warn}（上限 {stop}）。"
storage-stop: "&c錄製檔 {used} 已達上限 {stop}，已存檔並停止：{players}"
storage-stop-reminder: "&c錄製檔 {used} 已達上限 {stop}，請刪除舊檔。"
storage-resumed: "&a容量已降回上限以下，已恢復錄製：{players}"
storage-unblocked: "&a容量已降回上限以下，可以錄製。"

# ===== 聊天室輸入 =====
input-prompt-search: "&e輸入要搜尋的玩家名稱（「{cancel}」取消，{seconds} 秒逾時）"
input-cancelled: "&7已取消。"
input-timeout: "&7逾時，已取消。"

