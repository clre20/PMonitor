# PMonitor 訊息（& 顏色碼；{名稱} 會被替換）
# 缺少的項目會自動補上；config-version 請勿修改
config-version: 3

# ===== 一般 =====
no-permission: "&c沒有權限。"
unknown-command: "&c未知指令，輸入 /{label} help 查看。"
unknown-player: "&c找不到玩家 {player}（需曾進過伺服器）。"
usage: "&c用法：{usage}"
reloaded: "&a已重新載入。"
unknown-error: "未知錯誤"
none: "無"
list-separator: "、"
storage-no-limit: "不限"

# ===== 版本 =====
version:
  current: "&7目前版本：&f{version}"
  checking: "&7檢查更新中…"
  newer: "&e有新版本 &f{latest}&e（目前 {current}）：&b{url}"
  latest: "&a已是最新版本。"
  dev: "&7目前版本比 GitHub 新（開發版）。"
  failed: "&c檢查更新失敗：{reason}"
  join-notify: "&ePMonitor 有新版本 &f{latest}&e（目前 {current}）：&b{url}"
  reason-no-release: "GitHub 尚無發布版本"
  reason-no-tag: "Release 沒有版本標籤"
  reason-http: "HTTP {code}"
  reason-offline: "無法連線到 GitHub"

# ===== 說明 =====
help:
  header: "&b===== PMonitor {version} ====="
  open: " &f/{label} &7開啟介面"
  help: " &f/{label} help &7指令說明"
  version: " &f/{label} version &7版本與檢查更新"
  start: " &f/{label} start <玩家> &7開始錄製（離線則下次進服錄）"
  stop: " &f/{label} stop <玩家> &7停止錄製／取消待命／關閉自動錄製"
  status: " &f/{label} status &7錄製狀態"
  list: " &f/{label} list [玩家] &7錄製檔列表"
  download: " &f/{label} download <檔名> &7下載連結"
  delete: " &f/{label} delete <檔名> &7刪除錄製檔"
  reload: " &f/{label} reload &7重新載入設定"

# ===== 錄製 =====
record-started: "&a開始錄製 &f{player}"
record-waiting: "&7等 {player} 進入遊戲後開始錄製…"
record-armed: "&e{player} 離線中，下次進服時錄製。"
record-already: "&c{player} 已在錄製中。"
record-already-armed: "&e{player} 已設定下次進服錄製。"
record-stopped: "&a已停止錄製 &f{player}&a，存檔中…"
record-cancel-waiting: "&e已取消 {player} 的等待。"
record-saved: "&a已存檔：&f{file}"
record-save-failed: "&c{player} 存檔失敗：{error}"
record-disarmed: "&e已取消 {player} 的下次進服錄製。"
record-not-recording: "&c{player} 沒有在錄製或待命。"
record-auto-still-on: "&7{player} 的自動錄製仍開啟，再輸入 /{label} stop {player} 可關閉。"
record-start-failed: "&c無法錄製 {player}，請看主控台。"
record-blocked-storage: "&c容量已滿（{used} / {limit}），無法錄製。"
record-unavailable: "&c錄製功能無法使用：{reason}"
record-error: "&c{player} 錄製出錯，已停止並存檔：{error}"
record-split: "&7{player} 已自動分段（第 {part} 段）。"
notify-start: "&7你的畫面正在被錄製。"
notify-stop: "&7錄製已結束。"
auto-on: "&a已開啟 {player} 的自動錄製。"
auto-off: "&e已關閉 {player} 的自動錄製。"

# ===== 狀態 =====
status-header: "&b===== 錄製狀態 ====="
status-recording-line: " &c● &f{player} &7{duration} &8{size} 第 {part} 段"
