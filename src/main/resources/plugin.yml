name: PMonitor
description: '錄製指定玩家的遊戲畫面，產生 Flashback 回放檔'
prefix: PMonitor
version: '${version}'

main: clre20.pMonitor.PMonitor
api-version: '1.21.11'
load: POSTWORLD
softdepend: [ HttpHub ]

authors: [ Clre20 ]
website: https://github.com/clre20/PMonitor

commands:
  pmonitor:
    description: PMonitor 錄製管理
    usage: /<command> [help|version|start|stop|status|list|download|delete|reload]
    aliases: [ cpm ]

permissions:
  pmonitor.admin:
    description: 全部權限
    default: op
    children:
      pmonitor.use: true
      pmonitor.help: true
      pmonitor.version: true
      pmonitor.start: true
      pmonitor.stop: true
      pmonitor.status: true
      pmonitor.list: true
      pmonitor.download: true
      pmonitor.delete: true
      pmonitor.reload: true
  pmonitor.use:
    description: 開啟介面
    default: op
  pmonitor.help:
    description: 指令說明
    default: op
  pmonitor.version:
    description: 查看版本與檢查更新；有新版時登入會收到提醒
    default: op
  pmonitor.start:
    description: 開始錄製、設定待命與自動錄製
    default: op
  pmonitor.stop:
    description: 停止錄製、取消待命
    default: op
  pmonitor.status:
    description: 查看錄製狀態並接收錄製通知
    default: op
  pmonitor.list:
    description: 查看錄製檔
    default: op
  pmonitor.download:
    description: 取得下載連結
    default: op
  pmonitor.delete:
    description: 刪除錄製檔
    default: op
  pmonitor.reload:
    description: 重新載入設定
    default: op
